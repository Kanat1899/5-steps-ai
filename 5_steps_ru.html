<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 STEPS AI — Инклюзивная учебная платформа</title>
<style>
:root{--navy:#17345c;--blue:#2878bd;--gold:#f0bd4f;--bg:#f3f6fb;--ink:#243247;--muted:#68788c;--line:#e1e8f0;--ok:#24643f;--okbg:#e8f7ed;--okline:#56a77a;--bad:#9b3b30;--badbg:#fff0ee;--badline:#d87b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);font-size:18px;line-height:1.5}
header{background:linear-gradient(120deg,#17345c,#2878bd);color:#fff;padding:26px max(18px,calc((100% - 1200px)/2))}
.brand{font-size:13px;letter-spacing:2px;color:#ffdc8a;font-weight:bold}
.hero{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
h1{font-size:clamp(30px,4vw,44px);margin:9px 0}
header p{margin:0;line-height:1.5;color:#e6f0fb;max-width:740px;font-size:18px}
.pill{padding:12px 16px;border:1px solid #ffffff55;border-radius:14px;background:#ffffff15;font-weight:bold;font-size:18px}
main{max-width:1200px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 20px #17345c0a;min-width:0}
h2{margin:0 0 12px;color:var(--navy);font-size:24px}
h3{margin:15px 0 8px;color:var(--navy);font-size:20px}
p{margin:10px 0}
label{display:block;font-size:18px;font-weight:bold;color:#52647b;margin:12px 0 5px}
select,input,textarea{width:100%;padding:11px;border:1px solid #ccd7e4;border-radius:9px;background:#fff;font:inherit;font-size:18px;color:var(--ink)}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;font:inherit;font-size:18px;font-weight:bold;transition:transform .12s ease,filter .12s ease,background-color .2s ease,border-color .2s ease}
button:hover:not(:disabled){filter:brightness(.96)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
button.alt{background:#eaf2fb;color:var(--navy)}
button.gold{background:var(--gold);color:#45330a}
.topicgrid{display:grid;grid-template-columns:1fr;gap:7px}
.topicgrid button{background:#f1f5fa;color:#243247;text-align:left;font-weight:500}
.topicgrid button.sel{outline:2px solid var(--gold);background:#fff8e7}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}
.steps .step{background:#eff5fb;border:1px solid var(--line);border-radius:11px;padding:10px 3px;text-align:center;font-size:16px;font-weight:bold;color:var(--navy)}
.steps .step b{display:block;font-size:24px;margin-bottom:4px}
.steps .step.sel{background:#fff8e7;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.routes{display:flex;gap:7px;flex-wrap:wrap}
.routes button{flex:1;min-width:150px;background:#eef3f9;color:var(--navy)}
.routes button.sel{background:#fff2d1;outline:2px solid var(--gold)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.tabs button{background:#eaf2fb;color:var(--navy)}
.tabs button.sel{background:var(--navy);color:#fff}
.panel{background:#fbfcff;border:1px solid var(--line);border-radius:13px;padding:16px;min-height:210px;line-height:1.55}
.gridgame{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.tile{background:#fff;border:2px solid #dce5ef;color:#243247;min-height:58px;font-size:20px;overflow-wrap:anywhere}
.tile.letter{font-size:28px}
.tile.chosen{border-color:var(--blue);background:#eaf5ff}
.tile.done{border-color:var(--okline);background:var(--okbg);color:var(--ok)}
.tile.wrong{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
.tile.used{opacity:.35}
.tile:disabled:not(.done):not(.wrong):not(.used){opacity:.6}
.big-word{font-size:28px;letter-spacing:1px;color:var(--navy)}
.feedback{padding:10px 12px;border-radius:9px;background:#eef5fc;margin-top:10px;border:1px solid transparent}
.feedback.ok{background:var(--okbg);color:var(--ok);border-color:#bfe3cc}
.feedback.bad{background:var(--badbg);color:var(--bad);border-color:#f2c9c3}
.feedback.hint{background:#fff8e7;color:#6b4d0c;border-color:#f3dca3}
.sentence{min-height:52px;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#eaf2fb;color:var(--navy);border-radius:20px;padding:4px 12px;font-size:18px}
.muted{color:var(--muted);font-size:18px;line-height:1.5}
.small{font-size:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.record{padding:8px;background:#f5f8fc;border-radius:8px;margin:6px 0}
.match-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.match-columns>div{background:#f5f8fc;border:1px solid #dce5ef;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.match-columns h4{margin:2px 0 6px;text-align:center;color:#24466b;font-size:18px}
.match-tile{width:100%;min-height:52px;font-size:20px}
.match-tile.chosen{outline:3px solid #e4b83e}
.vpick label{display:inline;margin:0 6px 0 0;font-weight:normal;color:var(--muted)}
.vpick select{width:auto;max-width:100%;padding:6px 8px}

/* Простые анимации */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(0)}80%{transform:translateY(-2px)}}
.anim-pop{animation:pop .35s ease}
.anim-shake{animation:shake .4s ease}
.anim-fade{animation:fadeUp .3s ease both}
.anim-bounce{animation:bounce .6s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media(max-width:820px){main{grid-template-columns:1fr}.steps{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){main{padding:0 8px}.card{padding:12px}.panel{padding:10px}.steps{grid-template-columns:repeat(2,1fr)}.gridgame{gap:7px}.match-columns{gap:8px}.match-columns>div{padding:6px}.match-tile,.tile{font-size:18px;padding:10px 4px}.routes button{min-width:100%}.match-columns.long{grid-template-columns:1fr}}
/* На узком экране длинные слова не разрываются: карточки встают в один столбец */
@media(max-width:420px){.gridgame.long{grid-template-columns:1fr}}
@media print{header{padding:15px;background:#fff;color:#000}main{display:block}.card{box-shadow:none}.sidebar,.tabs,.routes,.bar,.steps{display:none!important}.panel{border:0}}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.langsw{display:flex;gap:4px;background:#ffffff1f;border:1px solid #ffffff44;padding:4px;border-radius:12px}
.langsw button{background:transparent;color:#fff;padding:7px 14px;font-size:18px}
.langsw button.sel{background:#fff;color:var(--navy)}
@media(max-width:820px){.hero-side{align-items:flex-start}}
@media print{.langsw{display:none!important}}
</style></head>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}
function upFirst(s){return s?s[0].toLocaleUpperCase('ru-RU')+s.slice(1):s}
function plural(n,f){const m10=n%10,m100=n%100;return f[(m10===1&&m100!==11)?0:(m10>=2&&m10<=4&&(m100<10||m100>=20))?1:2]}

function pickFreshWords(count,pool){pool=pool||taskWords();const key=[si,ti,tab,route,S.mode].join('-');const used=usedTaskSets[key]||(usedTaskSets[key]=[]);let pick,signature,tries=0;do{pick=shuffle(pool).slice(0,Math.min(count,pool.length));signature=[...pick].sort().join('|');tries++}while(used.includes(signature)&&tries<40);used.push(signature);if(used.length>30)used.shift();return pick}
function scrambleWord(word){return word.split(' ').map(part=>{const lower=part.toLocaleLowerCase('ru-RU');const cap=part!==lower&&part[0]!==lower[0];const chars=[...lower];if(chars.length<2)return part;let mixed=chars;for(let i=0;i<20;i++){mixed=shuffle(chars);if(mixed.join('')!==lower)break}if(mixed.join('')===lower)mixed=[...chars.slice(1),chars[0]];const out=mixed.join('');return cap?upFirst(out):out}).join(' ')}

// Мягкие чистые тона (синус), низкий регистр, плавная атака — без «гудков» и резких высоких нот.
const SOUND_LEVELS=[{key:'quiet',gain:.45},{key:'normal',gain:.8},{key:'off',gain:0}];
const Sound={ctx:null,master:null,level:Math.max(0,SOUND_LEVELS.findIndex(l=>l.key===store.get('5steps-sound','quiet'))),
 get on(){return SOUND_LEVELS[this.level].gain>0},
 build(ctx){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;const m=ctx.createGain();m.gain.value=SOUND_LEVELS[this.level].gain;m.connect(lp);lp.connect(ctx.destination);return m},
 init(){if(this.ctx)return this.ctx;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{this.ctx=new C();this.master=this.build(this.ctx)}catch(e){this.ctx=null}return this.ctx},
 tone(f,at,dur,o={}){const c=this.ctx,tt=c.currentTime+at,osc=c.createOscillator(),g=c.createGain(),att=o.attack||.02;osc.type='sine';osc.frequency.setValueAtTime(f,tt);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,tt+dur);g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(o.gain||.2,tt+att);g.gain.exponentialRampToValueAtTime(.0001,tt+dur);osc.connect(g);g.connect(this.master);osc.start(tt);osc.stop(tt+dur+.05)},
 note(f,at,dur,gain){this.tone(f,at,dur,{gain});this.tone(f*2,at,dur*.5,{gain:gain*.1})}, // мягкая «колокольчиковая» нота
 play(kind){if(!this.on)return;const c=this.init();if(!c)return;try{if(c.state==='suspended')c.resume();
  if(kind==='ok'){            // правильно: два мягких «динь-дон» вверх (ми → си)
   this.note(659.25,0,.35,.22);this.note(987.77,.1,.5,.2);
  }else if(kind==='bad'){     // ошибка: тихое низкое «оу-оу» вниз, чистый тон — не пугает
   this.tone(311,0,.2,{gain:.16,to:277,attack:.03});this.tone(262,.17,.32,{gain:.14,to:220,attack:.03});
  }else if(kind==='win'){     // всё выполнено: короткое мягкое арпеджио до–ми–соль–до
   [523.25,659.25,783.99].forEach((f,i)=>this.note(f,i*.12,.4,.18));this.note(1046.5,.36,.7,.15);
  }else if(kind==='tap'){this.tone(587,0,.06,{gain:.04})}
 }catch(e){}},
 cycle(){this.level=(this.level+1)%SOUND_LEVELS.length;store.set('5steps-sound',SOUND_LEVELS[this.level].key);if(this.master)this.master.gain.value=SOUND_LEVELS[this.level].gain;renderSoundBtn();this.play('tap')}
};

function renderSee(n,tp){const c=cfg();const mode=(n-1)%4;S.mode=mode;
 if(mode===0){const cards=pickFreshWords(c.cards);S.answer=rnd(cards);
  const hint=t('see0Hint'+route);
  return `<h3>${esc(t('see0Title'))}</h3><p>${t('see0Text',{t:ru(tp),w:ru(S.answer)})}</p>${tiles(cards,'see')}${fbBox('seeFeedback',t('routeLabel',{r:route})+hint)}`}
 if(mode===1){const k=Math.max(3,c.cards-1);const topicW=pickFreshWords(k);const odd=oddWords(1)[0];S.answer=odd;const cards=shuffle([...topicW,odd]);
  return `<h3>${esc(t('see1Title'))}</h3><p>${t('see1Text',{t:ru(tp)})}</p>${tiles(cards,'see')}${fbBox('seeFeedback',route==='A'?t('see1HintA'):t('see1Hint'))}`}
 if(mode===2){const pool=ruWords();const target=pickFreshWords(1,pool)[0];S.target=target;const L=w=>w[0].toLocaleUpperCase('ru-RU');S.answer=L(target);
  const opts=new Set([S.answer]);shuffle(pool.map(L)).forEach(x=>{if(opts.size<c.letters)opts.add(x)});shuffle([...'АБВГДЕЖЗИКЛМНОПРСТУФХЧШЯ']).forEach(x=>{if(opts.size<c.letters)opts.add(x)});
  return `<h3>${esc(t('see2Title'))}</h3><p>${t('see2Text',{w:`<b class="big-word" lang="ru">${esc(target)}</b>`})}</p>${tiles(shuffle([...opts]),'see','letter')}${fbBox('seeFeedback',route==='A'?t('see2HintA'):t('see2Hint'))}`}
 const pool=ruWords().filter(w=>!w.includes(' ')&&syllables(w)>0);const target=pickFreshWords(1,pool)[0];const s=syllables(target);S.target=target;S.answer=String(s);
 const start=Math.max(1,s-Math.floor(Math.random()*c.syll));const opts=[];for(let i=start;i<start+c.syll;i++)opts.push(String(i));
 return `<h3>${esc(t('see3Title'))}</h3><p>${t('see3Text',{w:`<b class="big-word" lang="ru">${esc(target)}</b>`})}</p>${tiles(opts,'see','letter')}${fbBox('seeFeedback',route==='C'?t('see3HintC'):t('see3Hint'),route==='C'?'':'hint')}`

// ---------- Озвучка (всегда русские слова) ----------
// Порядок: 1) живой нейроголос OpenAI (Netlify-функция tts — если сайт размещён на Netlify с ключом);
//          2) самый естественный русский голос устройства (нейронные голоса Edge, «Google русский», Milena…).
// Каждое нажатие отменяет предыдущее, поэтому два голоса никогда не звучат одновременно.
let curPlayer=null,ttsOnlineFailed=false,speakId=0,speakWatch=null;const ttsCache=new Map();
const SPEECH_RATE={A:.85,B:.95,C:1};
const VOICE_KEY='5steps-voice-name';
function setHearStatus(m){const s=$('hearStatus');if(s)s.textContent=m}
function setVoiceInfo(m){const s=$('voiceInfo');if(s)s.textContent=m}
function dataURLToBlob(u){const [head,b64]=u.split(',');const mime=(head.match(/data:([^;]+)/)||[])[1]||'audio/mpeg';const raw=atob(b64),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return new Blob([a],{type:mime})}
function stopSpeech(){speakId++;clearTimeout(speakWatch);try{if(curPlayer){curPlayer.pause();curPlayer=null}}catch(e){}try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
async function playURL(url,id,slow){const p=new Audio(url);p.playbackRate=slow?.8:1;try{p.preservesPitch=true}catch(e){}curPlayer=p;
 p.onended=()=>{if(curPlayer===p){curPlayer=null;setHearStatus(t('st_choose'))}};
 await p.play();if(id!==speakId){p.pause();return}setHearStatus(t('st_listen'))}
async function speak(text,slow){
 const phrase=String(text||'').trim();if(!phrase){setHearStatus(t('st_noword'));return}
 stopSpeech();const id=speakId;setHearStatus(t('st_prep'));
 if(/^https?:$/.test(location.protocol)&&!/github\.io$/.test(location.hostname)&&!ttsOnlineFailed){
  try{await speakOnline(phrase,id,slow);return}
  catch(err){if(id!==speakId)return;ttsOnlineFailed=true;console.warn('Онлайн-голос недоступен, используется голос устройства.',err)}
 }
 if(id!==speakId)return;
 await speakLocal(phrase,id,slow);
}
async function speakOnline(phrase,id,slow){
 let url=ttsCache.get(phrase);
 if(!url){
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),6000); // ребёнок не ждёт дольше 6 с
  try{
   const r=await fetch('/.netlify/functions/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:phrase}),signal:ctrl.signal});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const data=await r.json();if(!data||typeof data.audio!=='string'||!data.audio)throw new Error('нет аудио в ответе');
   url=URL.createObjectURL(dataURLToBlob('data:audio/mpeg;base64,'+data.audio));ttsCache.set(phrase,url); // повтор — мгновенно и бесплатно
  }finally{clearTimeout(timer)}
 }
 if(id!==speakId)return;                     // ребёнок уже нажал что-то другое — не говорим
 await playURL(url,id,slow);
 setVoiceInfo(t('vi_online'));
}
function voicesReady(){return new Promise(res=>{let v=[];try{v=speechSynthesis.getVoices()}catch(e){}if(v.length)return res(v);let done=false;const fin=()=>{if(done)return;done=true;let x=[];try{x=speechSynthesis.getVoices()}catch(e){}res(x)};try{speechSynthesis.addEventListener('voiceschanged',fin,{once:true})}catch(e){}setTimeout(fin,1500)})}
// Чем естественнее голос, тем выше балл: нейронные (Natural/Online) → Premium/Enhanced → Google → остальные.
function voiceScore(v){const n=v.name||'';let s=0;if(/natural|neural/i.test(n))s+=60;if(/online/i.test(n))s+=20;if(/premium|enhanced|улучш/i.test(n))s+=45;if(/google/i.test(n))s+=30;if(/svetlana|dariya|milena|katya|alyona|светлана|милена|алёна/i.test(n))s+=8;if(v.localService===false)s+=5;if(/^ru[-_]RU$/i.test(v.lang))s+=3;return s}
function ruVoices(list){return list.filter(v=>/^ru([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}
function bestRuVoice(list){return ruVoices(list)[0]||null}
// Голос, выбранный учителем в списке (если он есть на этом устройстве), иначе — самый естественный.
function chosenVoice(list){const name=store.get(VOICE_KEY,'');const r=ruVoices(list);return (name&&r.find(v=>v.name===name))||r[0]||null}
function isEdge(){return /Edg\//.test(navigator.userAgent)}
function voiceTip(v){if(voiceScore(v)>=30)return '';return isEdge()?t('vi_edgeOffline'):t('vi_weak')}
async function speakLocal(phrase,id,slow){
 if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){setHearStatus(t('st_nosynth'));return}
 const voices=await voicesReady();if(id!==speakId)return;
 const v=chosenVoice(voices);
 // Есть голоса, но нет русского — не читаем русское слово иностранным голосом (получаются странные звуки).
 if(voices.length&&!v){setHearStatus(t('st_noru'));setVoiceInfo(t('vi_noru'));return}
 // Точка в конце даёт спокойную, «утвердительную» интонацию — слово звучит чётче, без вопросительного подъёма.
 const say=/[.!?…]$/.test(phrase)?phrase:phrase+'.';
 try{const u=new SpeechSynthesisUtterance(say);u.lang=v?v.lang:'ru-RU';if(v)u.voice=v;u.rate=slow?.7:SPEECH_RATE[route];u.pitch=1;u.volume=1;let started=false;
  u.onstart=()=>{started=true;if(id===speakId){clearTimeout(speakWatch);setHearStatus(t('st_listen'))}};
  u.onend=()=>{if(id===speakId){clearTimeout(speakWatch);setHearStatus(t('st_choose'))}};
  u.onerror=e=>{if(id===speakId&&e.error!=='canceled'&&e.error!=='interrupted'){clearTimeout(speakWatch);setHearStatus(t('st_fail'))}};
  setVoiceInfo(v?t('vi_voice',{name:v.name})+voiceTip(v):'');
  try{speechSynthesis.resume()}catch(e){}   // Chrome иногда «залипает» на паузе
  speechSynthesis.speak(u);
  speakWatch=setTimeout(()=>{if(id===speakId&&!started)setHearStatus(t('st_fail'))},6000);  // если голос так и не зазвучал — честно сообщаем
 }catch(e){setHearStatus(t('st_fail'))}
}
// Список голосов устройства для учителя (появляется, если русских голосов несколько).
async function fillVoicePicker(){const sel=$('voiceSel'),box=$('voicePick');if(!sel||!box||!('speechSynthesis' in window))return;
 const list=ruVoices(await voicesReady());if(!$('voiceSel'))return;
 if(list.length<2){box.hidden=true;return}
 const cur=store.get(VOICE_KEY,'');
 sel.innerHTML=`<option value="">${esc(t('voiceAuto'))}</option>`+list.map(v=>`<option value="${esc(v.name)}"${v.name===cur?' selected':''}>${esc(v.name)}${voiceScore(v)>=30?' ★':''}</option>`).join('');
 box.hidden=false}
if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}let unl=false;const unlock=()=>{if(unl)return;unl=true;try{const z=new SpeechSynthesisUtterance(' ');z.volume=0;speechSynthesis.speak(z)}catch(e){}};document.addEventListener('touchend',unlock,{once:true,capture:true});document.addEventListener('click',unlock,{once:true,capture:true})}

// ---------- 3. ПОИГРАЙ / ОЙНА ----------
function renderPlay(){const c=cfg();const pool=taskWords().filter(w=>w.replace(/\s/g,'').length>=3);const chosen=pickFreshWords(c.pairs,pool);
 S.pairs=chosen.length;S.matched=0;S.selected=null;
 const scr=[];chosen.forEach(w=>{let s,tries=0;do{s=scrambleWord(w);tries++}while((chosen.some(x=>x.toLowerCase()===s.toLowerCase())||scr.includes(s))&&tries<30);scr.push(s)});
 const left=shuffle(chosen.map((w,i)=>scr[i])),right=shuffle(chosen);
 const col=(list,side)=>list.map(x=>`<button class="tile match-tile" lang="${wlang(x)}" data-act="pair" data-side="${side}" data-val="${esc(x)}">${esc(x)}</button>`).join('');
 return `<h3>${esc(t('playTitle'))}</h3><p>${t('playHow',{ex:`<b lang="ru">«амам» → «мама»</b>`})}</p><div class="match-columns${maxTok(chosen)>=9?' long':''}"><div><h4>${esc(t('col1'))}</h4>${col(left,'left')}</div><div><h4>${esc(t('col2'))}</h4>${col(right,'right')}</div></div>${fbBox('matchFeedback',t('playStart',{n:S.pairs}))}`}
function pickPair(el){
 if(el.classList.contains('done'))return;
 if(!S.selected){S.selected=el;el.classList.add('chosen');Sound.play('tap');return}
 if(S.selected===el){el.classList.remove('chosen');S.selected=null;return}
 if(S.selected.dataset.side===el.dataset.side){S.selected.classList.remove('chosen');S.selected=el;el.classList.add('chosen');Sound.play('tap');fb('matchFeedback',t('playOther'),'');return}
 const a=S.selected,b=el;a.classList.remove('chosen');S.selected=null;
 if(letterKey(a.dataset.val)===letterKey(b.dataset.val)){
  [a,b].forEach(x=>{x.classList.add('done');x.disabled=true;anim(x,'anim-pop')});S.matched++;
  if(S.matched===S.pairs){fb('matchFeedback',t('playAll'),'ok');Sound.play('win')}
  else{fb('matchFeedback',t('playOk',{m:S.matched,n:S.pairs}),'ok');Sound.play('ok')}
 }else{[a,b].forEach(x=>anim(x,'anim-shake'));fb('matchFeedback',t('playBad'),'bad');Sound.play('bad')}
}

// ---------- 4. СОСТАВЬ / ҚҰРАСТЫР (предложения — всегда на русском) ----------
function renderBuild(n,tp){const c=cfg();const mode=(n-1)%5;S.mode=mode;const a=pickFreshWords(1)[0];S.word=a;S.spec=null;
 if(mode===0||mode===3){
  const spec=mode===0
   ?{title:t('b0Title'),desc:t('b0Desc'),tokens:['сегодня','я','изучаю','слово','«'+a+'»','.'],phrases:[['изучаю','слово','«'+a+'»']],before:[['я','изучаю']],first:'сегодня'}
   :{title:t('b3Title'),desc:t('b3Desc'),tokens:['сегодня','на','уроке','я','изучаю','тему','«'+tp+'»','.'],phrases:[['на','уроке'],['изучаю','тему','«'+tp+'»']],before:[['я','изучаю']],first:'сегодня'};
  S.spec=spec;S.built=[];S.tries=0;S.solved=false;
  const bank=shuffle(spec.tokens.map((x,i)=>({x,i})));
  const hint=route==='A'?fbBox('buildHint',t('bHintA',{w:upFirst(spec.first)}),'hint'):'';
  return `<h3>${esc(spec.title)}</h3><p>${esc(spec.desc)}</p>${hint}<div class="gridgame" id="wordBank">${bank.map(o=>`<button class="tile" lang="ru" data-act="word" data-idx="${o.i}">${esc(o.x)}</button>`).join('')}</div><p><b>${esc(t('yourSentence'))}</b></p><div class="feedback sentence" id="sentenceResult" lang="ru"></div><div class="bar"><button class="alt" data-act="undo">${esc(t('undo'))}</button><button class="alt" data-act="reset">${esc(t('reset'))}</button><button data-act="check">${esc(t('check'))}</button></div>${fbBox('sentenceFeedback',t('bStart'))}`}
 const opts=shuffle([a,...oddWords(c.options-1)]);
 S.answer=mode===2?'«'+a+'».':a;
 const list=mode===2?opts.map(x=>'«'+x+'».'):opts;
 const z=mode===1?{title:t('c1Title'),desc:t('c1Desc'),prompt:'На уроке по теме «'+tp+'» я узнал(а) слово «___».'}
  :mode===2?{title:t('c2Title'),desc:t('c2Desc'),prompt:'В теме «'+tp+'» мы изучаем слово …'}
  :{title:t('c4Title'),desc:t('c4Desc'),prompt:'Новое слово по теме «'+tp+'» — ___.'};
 return `<h3>${esc(z.title)}</h3><p>${esc(z.desc)}</p><div class="feedback" style="font-size:22px" lang="ru">${esc(z.prompt)}</div>${tiles(list,'choice')}${fbBox('sentenceFeedback',t('cStart'))}`
}
function builtTokens(){return S.built.map(i=>S.spec.tokens[i])}
function showBuilt(){const el=$('sentenceResult');if(!el)return;const toks=builtTokens();el.textContent=toks.length?upFirst(toks.join(' ').replace(/\s+([.,!?])/g,'$1')):'…'}
function addWord(el){if(S.solved)return;S.built.push(+el.dataset.idx);el.disabled=true;el.classList.add('used');Sound.play('tap');showBuilt();anim($('sentenceResult'),'anim-fade')}
function undoWord(){if(S.solved||!S.built.length)return;const i=S.built.pop();const b=document.querySelector('#wordBank [data-idx="'+i+'"]');if(b){b.disabled=false;b.classList.remove('used')}showBuilt()}
function resetWords(){if(S.solved)return;S.built=[];document.querySelectorAll('#wordBank .tile').forEach(b=>{b.disabled=false;b.classList.remove('used')});showBuilt();fb('sentenceFeedback',t('bReset'),'')}
// Проверка с учётом свободного порядка слов в русском языке: правила, а не одна строка.
function checkOrder(seq,spec){
 if(seq.length<spec.tokens.length)return{ok:false,msg:t('bIncomplete',{n:spec.tokens.length-seq.length})};
 if(seq[seq.length-1]!=='.')return{ok:false,msg:t('bDot')};
 for(const ph of spec.phrases){const i=seq.indexOf(ph[0]);if(i<0||ph.some((w,k)=>seq[i+k]!==w))return{ok:false,msg:t('bPhrase',{p:ph.join(' ')})}}
 for(const [x,y] of spec.before){if(seq.indexOf(x)>seq.indexOf(y))return{ok:false,msg:t('bOrder',{x,y})}}
 return{ok:true};
}
function checkSentence(){if(!S.spec||S.solved)return;S.tries++;const res=checkOrder(builtTokens(),S.spec);
 if(res.ok){S.solved=true;document.querySelectorAll('#activity [data-act="word"],#activity [data-act="undo"],#activity [data-act="reset"],#activity [data-act="check"]').forEach(b=>b.disabled=true);const r=$('sentenceResult');r.classList.add('ok');anim(r,'anim-pop');fb('sentenceFeedback',t('bWin'),'ok');Sound.play('win')}
 else{anim($('sentenceResult'),'anim-shake');const msg=(route==='C'&&S.tries===1)?t('bGeneric'):res.msg;fb('sentenceFeedback',msg,'bad');Sound.play('bad')}
}
function onChoice(el){const v=el.dataset.val;if(v===S.answer){lockTiles();good(el,'sentenceFeedback',t('cOk'))}else{el.disabled=true;bad(el,'sentenceFeedback',t('cBad',{v:v.replace(/[«».]/g,'')}))}}

// ---------- 5. ПРЕДСТАВЬ / ҰСЫН (ответ ребёнка — на русском) ----------
function renderPresent(n,tp){const helpers=pickFreshWords(route==='A'?3:route==='B'?4:5);S.helpers=helpers;const q=topic()[2]||[];
 const R=ru(tp),H=helpers.map(ru).join(', '),Q=ru(q[(n-1)%Math.max(q.length,1)]||'Что ты знаешь об этой теме?');
 const P={
  A:[{k:'prA1',w:2,tw:2,s:0},{k:'prA2',w:3,tw:1,s:0},{k:'prA3',w:3,tw:1,s:0}],
  B:[{k:'prB1',w:8,tw:2,s:2},{k:'prB2',w:4,tw:1,s:1},{k:'prB3',w:9,tw:2,s:3}],
  C:[{k:'prC1',w:25,tw:3,s:5},{k:'prC2',w:15,tw:3,s:3},{k:'prC3',w:20,tw:4,s:3}]
 }[route];
 const p=P[(n-1)%P.length];S.req=p;
 const text=t(p.k,{t:R,h:H,q:Q,f:ru('Мне нравится…')});
 const need=LANG==='kk'
  ?'Қажет: кемінде '+p.w+' сөз, тақырып бойынша '+p.tw+' сөз'+(p.s?', '+p.s+' сөйлем':'')+'.'
  :'Нужно: не меньше '+p.w+' '+plural(p.w,['слова','слов','слов'])+', '+p.tw+' '+plural(p.tw,['слово','слова','слов'])+' по теме'+(p.s?', '+p.s+' '+plural(p.s,['предложение','предложения','предложений']):'')+'.';
 return `<h3>${esc(t('prTitle'))}</h3><p><b>${esc(t('prTask'))}</b> ${text}</p><p class="muted small">${esc(need)}</p><div class="chips" aria-label="${esc(t('helpersAria'))}">${helpers.map(w=>`<span class="chip" lang="${wlang(w)}">${esc(w)}</span>`).join('')}</div><label for="presentation">${esc(t('myAnswer'))}</label><textarea id="presentation" rows="5" lang="ru" spellcheck="true" placeholder="${esc(t('answerPh'))}"></textarea><div class="bar"><button data-act="present">${esc(t('checkAnswer'))}</button></div>${fbBox('presentationFeedback',t('prStart'))}`}
function normText(s){return String(s).toLocaleLowerCase('ru-RU').replace(/ё/g,'е')}
function textTokens(s){return normText(s).split(/[^a-zа-яәіңғүұқөһ]+/i).filter(Boolean)}
function stem(w){return w.length>=6?w.slice(0,-2):w.length>=4?w.slice(0,-1):w}
function usesWord(toks,word){return normText(word).split(/\s+/).every(p=>{const st=stem(p);return toks.some(x=>x.startsWith(st))})}
function checkPresentation(){
 const v=$('presentation').value.trim(),p=S.req;
 if(!v){fb('presentationFeedback',t('prEmpty'),'bad');Sound.play('bad');return}
 const toks=textTokens(v),n=toks.length;
 const used=taskWords().filter(w=>usesWord(toks,w));
 const sentences=v.split(/[.!?…]+/).filter(x=>textTokens(x).length>0).length;
 const freq={};toks.forEach(w=>freq[w]=(freq[w]||0)+1);const maxRepeat=Math.max(0,...Object.values(freq));
 // Ответ должен быть на русском: слова с казахскими или латинскими буквами (кроме слов темы) — сигнал.
 const topicSet=new Set(taskWords().map(normText));
 const foreign=toks.filter(x=>/[әіңғүұқөһa-z]/i.test(x)&&!topicSet.has(x)).length;
 const problems=[];
 if(n>=2&&foreign/n>.2)problems.push(t('prRussian'));
 if(n<p.w)problems.push(t('prMoreWords',{n,w:p.w}));
 if(used.length<p.tw)problems.push(t('prTopic',{u:used.length,tw:p.tw,h:S.helpers.slice(0,3).map(w=>'«'+w+'»').join(', ')}));
 if(p.s&&sentences<p.s)problems.push(LANG==='kk'?'Кемінде '+p.s+' сөйлем жаз. Әр сөйлемнің соңына нүкте қой.':'Напиши не меньше '+p.s+' '+plural(p.s,['предложения','предложений','предложений'])+'. В конце каждого ставь точку.');
 if(n>=5&&maxRepeat/n>.4)problems.push(t('prRepeat'));
 if(!problems.length){fb('presentationFeedback',t('prGood',{n})+(used.length?t('prUsed',{list:used.map(w=>'«'+w+'»').join(', ')}):''),'ok');Sound.play('win')}
 else{fb('presentationFeedback',problems.join(' '),'bad');Sound.play('bad')}
}

// ---------- Мониторинг прогресса ----------
const STATUS_LEGACY={'Выполнено с поддержкой':'support','Выполнено с подсказками':'hints','Выполнено самостоятельно':'self'};
function statusLabel(x){const k=x.statusKey||STATUS_LEGACY[x.status];return k?t('st_'+k):(x.status||'')}
function loadProgress(){try{const a=JSON.parse(store.get('5steps-progress','[]'));return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveProgress(){const a=loadProgress();a.unshift({student:$('student').value.trim()||t('defaultStudent'),section:DATA[si][0],topic:topic()[0],route,statusKey:$('progressStatus').value,date:new Date().toLocaleDateString('ru-RU')});
 if(store.set('5steps-progress',JSON.stringify(a))){renderProgress();Sound.play('ok');const f=$('progressList').querySelector('.record');if(f)anim(f,'anim-pop')}else{$('progressList').textContent=t('saveFail');Sound.play('bad')}}
function renderProgress(){const a=loadProgress();$('progressList').innerHTML=a.length?('<div>'+esc(t('totalRecords',{n:a.length}))+'</div>'+a.slice(0,7).map(x=>`<div class="record">${esc(x.date)} · ${esc(x.student)}<br><b lang="ru">${esc(x.topic)}</b> · ${esc(x.route)}<br>${esc(statusLabel(x))}</div>`).join('')):esc(t('noRecords'))}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportProgress(){const a=loadProgress();if(!a.length){$('progressList').textContent=t('noExport');return}
 const rows=[t('csvHead').split(';'),...a.map(x=>[x.date,x.student,x.section||'',x.topic,x.route,statusLabel(x)])];
 downloadBlob('5steps-progress.csv',new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}))}
function clearProgress(){if(!loadProgress().length)return;if(confirm(t('clearConfirm'))){store.set('5steps-progress','[]');renderProgress()}}

init();
</script></body></html>
